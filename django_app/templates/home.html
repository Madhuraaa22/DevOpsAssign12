<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - DevOps Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -250px;
            right: -250px;
            animation: float 6s ease-in-out infinite;
        }
        
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            bottom: -200px;
            left: -200px;
            animation: float 8s ease-in-out infinite reverse;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(20px); }
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 60px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
            position: relative;
            z-index: 10;
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #2a5298, #7e22ce);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            font-weight: bold;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(126, 34, 206, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        h1 {
            color: #1a1a2e;
            margin-bottom: 15px;
            font-size: 32px;
            font-weight: 700;
        }
        
        .subtitle {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 40px;
        }
        
        .user-card {
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            border: 2px solid #e2e8f0;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 35px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        
        .user-avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #7e22ce, #9333ea);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(126, 34, 206, 0.3);
        }
        
        .user-info {
            text-align: center;
        }
        
        .user-label {
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .username {
            color: #7e22ce;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        .welcome-message {
            font-size: 18px;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .status-badge {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .status-badge::before {
            content: '●';
            margin-right: 6px;
            animation: blink 2s ease-in-out infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 35px;
        }
        
        button {
            flex: 1;
            padding: 14px 20px;
            background: linear-gradient(135deg, #2a5298 0%, #7e22ce 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(126, 34, 206, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(126, 34, 206, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .logout-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        
        .logout-btn:hover {
            box-shadow: 0 6px 25px rgba(239, 68, 68, 0.4);
        }
        
        .footer-text {
            margin-top: 30px;
            color: #94a3b8;
            font-size: 13px;
        }
        
        @media (max-width: 480px) {
            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-icon">D</div>
        
        <h1>Welcome to DevOps Portal</h1>
        <p class="subtitle">You're successfully logged in</p>
        
        <div class="user-card">
            <div class="user-avatar">{{ username|first|upper }}</div>
            
            <div class="user-info">
                <div class="user-label">Logged in as</div>
                <div class="username">{{ username }}</div>
                <div class="welcome-message">
                    Hello {{ username }}! How are you doing today?
                </div>
                <div class="status-badge">Online</div>
            </div>
        </div>
        
        <div class="actions">
            <form method="POST" action="{% url 'logout' %}" style="flex: 1;">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Sign Out</button>
            </form>
        </div>
        
        <div class="footer-text">
            DevOps Portal © 2025 | Secure Session
        </div>
    </div>
</body>
</html>
